services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_agent
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: trading
      MINIO_ROOT_PASSWORD: trading-local-only
    volumes: [minio-data:/data]
  temporal:
    image: temporalio/auto-setup:1.27
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: trading
      POSTGRES_PWD: trading-local-only
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8088:8080"]
  otel-collector:
    image: otel/opentelemetry-collector:0.130.1
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./infra/otel-collector.yaml:/etc/otel.yaml:ro"]
  api:
    build: .
    command: uvicorn trading_agent.api.app:app --host 0.0.0.0 --port 8000
    environment:
      TRADING_AGENT_ENABLE_ORDER_EXECUTION: "false"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    command: python -c "from trading_agent.workflows.worker import build_worker; build_worker()"
    environment:
      TRADING_AGENT_ENABLE_ORDER_EXECUTION: "false"
  web:
    build: ./web
    ports: ["3107:3000"]
    depends_on: [api]
volumes:
  postgres-data:
  minio-data:
